name: Recover 1.2.4 Release

# 一次性恢复：只为已冻结的源码补装测试依赖，不移动 Tag、不重建或覆盖镜像。
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  RELEASE_TAG: v1.2.4
  RELEASE_SHA: 461c7c1519bfc6946a171f7f1fce689330dfaed5

concurrency:
  group: recover-release-1.2.4
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 461c7c1519bfc6946a171f7f1fce689330dfaed5
      - name: Verify frozen source, original artifacts and existing image
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, urllib.request, urllib.error
          sha = os.environ['RELEASE_SHA']
          repository = os.environ['GITHUB_REPOSITORY']
          def get(url, headers=None):
              request = urllib.request.Request(url, headers=headers or {})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.read(), dict(response.headers)
          def api(path):
              data, _ = get('https://api.github.com/repos/' + repository + '/' + path,
                            {'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
              return json.loads(data)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == sha
          tag = api('git/ref/tags/v1.2.4')['object']
          if tag['type'] == 'tag':
              tag = api('git/tags/' + tag['sha'])['object']
          assert tag['type'] == 'commit' and tag['sha'] == sha
          run = api('actions/runs/34449318112')
          assert run['head_sha'] == sha and run['conclusion'] == 'failure'
          jobs = api('actions/runs/34449318112/jobs?per_page=100')['jobs']
          for name in ('bundles', 'image'):
              assert any(job['name'] == name and job['conclusion'] == 'success' for job in jobs)
          assets = api('actions/runs/34449318112/artifacts')['artifacts']
          assert any(a['name'] == 'portable-bundles' and not a['expired'] for a in assets)
          try:
              api('releases/tags/v1.2.4')
          except urllib.error.HTTPError as error:
              assert error.code == 404
          else:
              raise RuntimeError('Release already exists; recovery must not overwrite it')
          gitee, _ = get('https://gitee.com/api/v5/repos/chuzifeng/auto-script_-hub/releases/tags/v1.2.4')
          assert json.loads(gitee) is None, 'Gitee Release already exists'
          token, _ = get('https://ghcr.io/token?service=ghcr.io&scope=repository:czf39631/autoscript-hub-server:pull')
          index, headers = get('https://ghcr.io/v2/czf39631/autoscript-hub-server/manifests/1.2.4', {
              'Authorization': 'Bearer ' + json.loads(token)['token'],
              'Accept': 'application/vnd.oci.image.index.v1+json'})
          assert hashlib.sha256(index).hexdigest() == '999b7a2068dca823dc5bcaba04d84c0b55045065d5655eb0a0f79ecbba81a069'
          platforms = {m['platform']['architecture'] for m in json.loads(index)['manifests'] if m.get('platform', {}).get('os') == 'linux'}
          assert {'amd64', 'arm64'} <= platforms
          print('Frozen Tag, retained bundles and immutable dual-platform image verified')
          PY

  windows:
    needs: [ci, verify]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 461c7c1519bfc6946a171f7f1fce689330dfaed5
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.9'}
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: choco install innosetup --no-progress -y
      - name: Supply missing test dependency without changing frozen source
        run: python -m pip install PyYAML==6.0.2
      - name: Build frozen 1.2.4 client
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:RELEASE_SHA) { throw 'Source SHA mismatch' }
          & release/windows/build.ps1 -Version 1.2.4
      - name: Install and smoke-test the packaged client on the isolated runner
        shell: pwsh
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'autoscript-installed-1.2.4'
          $data = Join-Path $env:RUNNER_TEMP 'autoscript-data-1.2.4'
          $log = Join-Path $env:RUNNER_TEMP 'autoscript-install-1.2.4.log'
          $installer = (Resolve-Path 'release-output/AutoScript-Hub-Setup-1.2.4.exe').Path
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOCLOSEAPPLICATIONS', "/DIR=`"$install`"", "/LOG=`"$log`"")
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content $log; throw 'Installer failed' }
          python release/windows/smoke_installed_client.py --install-dir "$install" --data-dir "$data" --expected-version 1.2.4
          if ($LASTEXITCODE -ne 0) { throw 'Installed client smoke failed' }
      - uses: actions/upload-artifact@v4
        with: {name: windows-release, path: release-output/AutoScript-Hub-Setup-1.2.4.exe, if-no-files-found: error}

  publish:
    needs: [windows, verify]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: ${{ vars.GITEE_OWNER }}
      GITEE_REPO: ${{ vars.GITEE_REPO }}
      GITEE_ENABLED: ${{ secrets.GITEE_TOKEN != '' && vars.GITEE_OWNER != '' && vars.GITEE_REPO != '' }}
      LAN_INSTALLER_URL_BASE: ${{ vars.LAN_INSTALLER_URL_BASE }}
      LAN_ENABLED: ${{ vars.LAN_INSTALLER_URL_BASE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 461c7c1519bfc6946a171f7f1fce689330dfaed5
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-output
      - name: Reuse original immutable deployment and Skill bundles
        uses: actions/download-artifact@v4
        with:
          name: portable-bundles
          run-id: 34449318112
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-output
      - run: python -m pip install cryptography requests
      - name: Require signing secret
        run: test -n "${{ secrets.UPDATE_PRIVATE_KEY_B64 }}"
      - name: Restore signing key
        run: echo '${{ secrets.UPDATE_PRIVATE_KEY_B64 }}' | base64 -d > update-private-key.pem
      - name: Create draft releases and upload assets before manifest
        id: release_hosts
        run: |
          VERSION="${RELEASE_TAG#v}"
          RELEASE_NOTES_FILE="docs/releases/$RELEASE_TAG.md"
          GITEE_TARGET_COMMIT="$(git rev-parse HEAD)"
          GH_PRERELEASE=()
          if [[ "$RELEASE_TAG" == *-* ]]; then GH_PRERELEASE=(--prerelease); fi
          if [[ -f "$RELEASE_NOTES_FILE" ]]; then
            GH_NOTES=(--notes-file "$RELEASE_NOTES_FILE")
            GITEE_BODY="$(cat "$RELEASE_NOTES_FILE")"
          else
            GH_NOTES=(--notes "AutoScript Hub $VERSION")
            GITEE_BODY="AutoScript Hub $VERSION"
          fi
          # 创建草稿时直接附带基础资产，避免随后按标签查询草稿的短暂一致性问题。
          gh release create "$RELEASE_TAG" release-output/*.exe release-output/*.zip \
            --draft "${GH_PRERELEASE[@]}" --title "$RELEASE_TAG" "${GH_NOTES[@]}"
          if [[ "$GITEE_ENABLED" == "true" ]]; then
            GITEE_RELEASE_ID="$(python release/scripts/gitee_release.py create --owner "$GITEE_OWNER" --repo "$GITEE_REPO" --token "$GITEE_TOKEN" --tag "$RELEASE_TAG" --target-commitish "$GITEE_TARGET_COMMIT" --body "$GITEE_BODY")"
            test -n "$GITEE_RELEASE_ID"
            echo "gitee_release_id=$GITEE_RELEASE_ID" >> "$GITHUB_OUTPUT"
            # Gitee 只镜像轻量发布资产和签名清单；完整安装包由 GitHub 托管。
            GITEE_FILES=()
            for file in release-output/*.zip; do
              GITEE_FILES+=(--file "$file")
            done
            python release/scripts/gitee_release.py upload --owner "$GITEE_OWNER" --repo "$GITEE_REPO" --token "$GITEE_TOKEN" --release-id "$GITEE_RELEASE_ID" "${GITEE_FILES[@]}"
          fi
      - name: Sign and mirror update manifest
        run: |
          VERSION="${RELEASE_TAG#v}"
          INSTALLER="release-output/AutoScript-Hub-Setup-$VERSION.exe"
          URLS=(--url "https://github.com/${GITHUB_REPOSITORY}/releases/download/$RELEASE_TAG/$(basename "$INSTALLER")")
          # GitHub 完整 EXE 上传成功后才签署清单，Gitee 仅镜像清单和签名。
          python release/scripts/make_update_manifest.py --version "$VERSION" --installer "$INSTALLER" --private-key update-private-key.pem --output release-output "${URLS[@]}"
          python release/scripts/write_checksums.py --directory release-output
          gh release upload "$RELEASE_TAG" release-output/autoscript-hub-update.json release-output/autoscript-hub-update.json.sig release-output/SHA256SUMS.txt
          if [[ "$GITEE_ENABLED" == "true" ]]; then
            python release/scripts/gitee_release.py upload --owner "$GITEE_OWNER" --repo "$GITEE_REPO" --token "$GITEE_TOKEN" --release-id "${{ steps.release_hosts.outputs.gitee_release_id }}" --file release-output/autoscript-hub-update.json --file release-output/autoscript-hub-update.json.sig --file release-output/SHA256SUMS.txt
          fi
      - name: Generate LAN-only signed manifest bundle (optional)
        if: env.LAN_ENABLED == 'true'
        run: |
          VERSION="${RELEASE_TAG#v}"
          INSTALLER="release-output/AutoScript-Hub-Setup-$VERSION.exe"
          INSTALLER_NAME="$(basename "$INSTALLER")"
          LAN_URL="${LAN_INSTALLER_URL_BASE}/api/release/installer/${INSTALLER_NAME}"
          mkdir -p release-output/lan
          python release/scripts/make_update_manifest.py \
            --version "$VERSION" \
            --installer "$INSTALLER" \
            --private-key update-private-key.pem \
            --url "$LAN_URL" \
            --output release-output/lan
          cd release-output
          zip -j lan-release-bundle.zip \
            lan/autoscript-hub-update.json \
            lan/autoscript-hub-update.json.sig \
            "$INSTALLER_NAME"
      - name: Upload LAN bundle as private workflow artifact
        if: env.LAN_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lan-release-bundle
          path: release-output/lan-release-bundle.zip
          if-no-files-found: error
      - name: Publish both release hosts
        run: |
          GITEE_PRERELEASE=false
          if [[ "$RELEASE_TAG" == *-* ]]; then GITEE_PRERELEASE=true; fi
          if [[ "$GITEE_ENABLED" == "true" ]]; then
            python release/scripts/gitee_release.py publish --owner "$GITEE_OWNER" --repo "$GITEE_REPO" --token "$GITEE_TOKEN" --release-id "${{ steps.release_hosts.outputs.gitee_release_id }}" --prerelease "$GITEE_PRERELEASE"
          fi
          gh release edit "$RELEASE_TAG" --draft=false
      - name: Verify configured public mirrors anonymously
        run: |
          python release/scripts/verify_release_mirrors.py --directory release-output \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          if [[ "$GITEE_ENABLED" == "true" ]]; then
            GITEE_RELEASE_BASE="https://gitee.com/$GITEE_OWNER/$GITEE_REPO/releases/download/$RELEASE_TAG"
            curl -fLsS "$GITEE_RELEASE_BASE/autoscript-hub-update.json" -o /tmp/gitee-manifest.json
            curl -fLsS "$GITEE_RELEASE_BASE/autoscript-hub-update.json.sig" -o /tmp/gitee-manifest.json.sig
            python - <<'PY'
          from pathlib import Path
          from client.update.trust import load_update_public_key
          from shared.update_manifest import UpdateManifest
          manifest = UpdateManifest.from_bytes(
              Path('/tmp/gitee-manifest.json').read_bytes(),
              Path('/tmp/gitee-manifest.json.sig').read_bytes(),
              load_update_public_key(),
          )
          assert not manifest.asset_for('windows-x86_64').parts
          print(f'Gitee signed manifest verified: {manifest.version}')
          PY
          fi
      - name: Preserve releases after publication failure
        if: failure()
        run: |
          echo '::error::Publication failed. Existing releases and assets are preserved; do not overwrite or delete published versions. Inspect retained drafts and logs before any recovery.'

  lan-sync:
    needs: publish
    if: vars.LAN_INSTALLER_URL_BASE != '' && vars.LAN_RUNNER_LABEL != ''
    runs-on: [self-hosted, linux, "${{ vars.LAN_RUNNER_LABEL }}"]
    env:
      LAN_SYNC_TOKEN: ${{ secrets.LAN_SYNC_TOKEN }}
      LAN_INSTALLER_URL_BASE: ${{ vars.LAN_INSTALLER_URL_BASE }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lan-release-bundle
          path: lan-sync
      - name: Upload LAN bundle to release-cache server
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer ${LAN_SYNC_TOKEN}" \
            -H "Content-Type: application/zip" \
            --data-binary @lan-sync/lan-release-bundle.zip \
            "${LAN_INSTALLER_URL_BASE}/api/release/sync"
