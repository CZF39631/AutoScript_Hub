name: Gitee Release API Smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Gitee tag used for the temporary release
        required: true
        default: v1.2.0
      cleanup_release_id:
        description: Optional numeric Gitee release ID to delete instead of running smoke
        required: false
        default: ''

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: ${{ vars.GITEE_OWNER }}
      GITEE_REPO: ${{ vars.GITEE_REPO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install requests
      - name: Delete an incomplete Gitee release
        if: inputs.cleanup_release_id != ''
        run: |
          python release/scripts/gitee_release.py delete \
            --owner "$GITEE_OWNER" --repo "$GITEE_REPO" --token "$GITEE_TOKEN" \
            --release-id "${{ inputs.cleanup_release_id }}"
      - name: Create, update and delete a temporary Gitee release
        if: inputs.cleanup_release_id == ''
        env:
          TEST_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITEE_TOKEN"
          test -n "$GITEE_OWNER"
          test -n "$GITEE_REPO"
          TARGET_COMMIT="$(git rev-parse HEAD)"
          RELEASE_ID=""
          cleanup() {
            if [[ -n "$RELEASE_ID" ]]; then
              python release/scripts/gitee_release.py delete \
                --owner "$GITEE_OWNER" --repo "$GITEE_REPO" --token "$GITEE_TOKEN" \
                --release-id "$RELEASE_ID" || true
            fi
          }
          trap cleanup EXIT
          RELEASE_ID="$(python release/scripts/gitee_release.py create \
            --owner "$GITEE_OWNER" --repo "$GITEE_REPO" --token "$GITEE_TOKEN" \
            --tag "$TEST_TAG" --target-commitish "$TARGET_COMMIT" \
            --body "AutoScript Hub Gitee Release API smoke test")"
          python release/scripts/gitee_release.py publish \
            --owner "$GITEE_OWNER" --repo "$GITEE_REPO" --token "$GITEE_TOKEN" \
            --release-id "$RELEASE_ID" --prerelease true
